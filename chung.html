    background-position:center 20%;
    background-repeat:no-repeat;
    font-family:-apple-system,"PingFang TC","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK TC",sans-serif;
    color:var(--soy);
    display:flex;align-items:center;justify-content:center;
    padding:40px 22px;
  }
  .serif{font-family:"Songti TC","Songti SC","Noto Serif TC","Noto Serif SC",Georgia,serif}

  /* ── 點心紙 ticket ── */
  .ticket{
    width:100%;max-width:400px;
    background:rgba(247,239,221,.24);
    -webkit-backdrop-filter:blur(6px) saturate(1.1);
    backdrop-filter:blur(6px) saturate(1.1);
    border-radius:14px;
    padding:34px 30px 26px;
    box-shadow:0 18px 50px rgba(0,0,0,.45), 0 2px 0 var(--paper-edge) inset;
    position:relative;
  }
  /* perforated ticket top */
  .ticket::before{
    content:"";position:absolute;left:18px;right:18px;top:0;height:5px;
    background-image:radial-gradient(circle at 5px 0, var(--soy) 4px, transparent 4.5px);
    background-size:16px 5px;background-repeat:repeat-x;
    opacity:.9;
  }
  .eyebrow{
    display:flex;justify-content:space-between;align-items:center;
    font-size:11px;letter-spacing:.22em;color:var(--soy-soft);
    text-transform:uppercase;margin-bottom:24px;
  }
  .eyebrow .no{letter-spacing:.08em}

  /* ── avatar + steam ── */
  .head{text-align:center}
  .bowl{
    width:104px;height:104px;margin:0 auto 6px;position:relative;
  }
  .steam{position:absolute;left:0;right:0;top:-16px;height:18px;text-align:center;pointer-events:none}
  .steam span{
    display:inline-block;width:2px;height:14px;margin:0 5px;border-radius:2px;
    background:linear-gradient(to top, rgba(92,64,40,.35), transparent);
    animation:steam 2.6s ease-in-out infinite;
  }
  .steam span:nth-child(2){animation-delay:.9s;height:11px}
  .steam span:nth-child(3){animation-delay:1.7s}
  @keyframes steam{
    0%{transform:translateY(4px) scaleY(.6);opacity:0}
    35%{opacity:.9}
    100%{transform:translateY(-8px) scaleY(1.15);opacity:0}
  }
  @media (prefers-reduced-motion: reduce){
    .steam span{animation:none;opacity:.35}
  }
  .avatar{
    width:104px;height:104px;border-radius:50%;
    background:linear-gradient(160deg, var(--rice), #efe4cd);
    border:3px solid var(--soy);
    display:flex;align-items:center;justify-content:center;
    font-size:34px;font-weight:700;color:var(--soy);
    overflow:hidden;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}

  h1{font-size:34px;letter-spacing:.04em;margin-top:12px}
  .latin{font-size:15px;letter-spacing:.3em;color:var(--soy-soft);margin-top:2px;text-transform:uppercase}

  .qq-note{
    font-size:11.5px;letter-spacing:.05em;color:var(--soy-soft);
    margin-top:8px;
  }

  /* languages as little stamps */
  .langs{
    display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
    margin:16px 0 4px;
  }
  .langs span{
    font-size:11px;letter-spacing:.06em;color:var(--soy-soft);
    border:1px solid var(--paper-edge);border-radius:999px;
    padding:3px 9px;background:rgba(255,255,255,.55);
  }

  .tags{
    display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
    margin:8px 0 4px;
  }
  .tags span{
    font-size:11px;letter-spacing:.06em;color:var(--scallion);
    border:1px solid rgba(119,133,79,.45);border-radius:999px;
    padding:3px 9px;background:rgba(255,255,255,.5);
  }
  .rule{
    border:none;border-top:1.5px dashed var(--paper-edge);
    margin:20px 0 8px;
  }
  .rule + .menu-label{
    font-size:11px;letter-spacing:.24em;color:var(--soy-soft);
    text-align:center;margin-bottom:10px;
  }

  /* ── link rows ── */
  .links{list-style:none}
  .links a{
    display:flex;align-items:center;gap:12px;
    padding:12px 8px;
    color:var(--soy);text-decoration:none;
    border-bottom:1px dashed var(--paper-edge);
    font-size:15.5px;
    transition:background .15s ease, transform .15s ease;
    border-radius:8px;
  }
  .links li:last-child a{border-bottom:none}
  .links .emoji{width:26px;text-align:center;font-size:18px}
  .links .name{flex:1}
  .links .tick{
    width:18px;height:18px;border:1.5px solid var(--soy-soft);
    border-radius:4px;display:flex;align-items:center;justify-content:center;
    font-size:12px;color:var(--chili);
  }
  .links .tick::after{content:"";opacity:0;transition:opacity .15s ease}
  .links a:hover,.links a:focus-visible{
    background:rgba(188,63,33,.07);
    transform:translateX(3px);
  }
  .links a:hover .tick::after,
  .links a:focus-visible .tick::after{content:"✓";opacity:1}
  .links a:focus-visible{outline:2px solid var(--chili);outline-offset:2px}
  @media (prefers-reduced-motion: reduce){
    .links a{transition:none}
  }

  /* ── footer + chop ── */
  footer{
    margin-top:22px;text-align:center;color:var(--soy-soft);
    font-size:12.5px;line-height:1.9;position:relative;
  }
  .chop{
    display:inline-flex;align-items:center;justify-content:center;
    width:44px;height:44px;margin-bottom:8px;
    border:2.5px solid var(--chili);border-radius:8px;
    color:var(--chili);font-size:17px;font-weight:700;
    transform:rotate(-6deg);letter-spacing:0;
    opacity:.85;
  }
</style>
</head>
<body>

<main class="ticket">
  <div class="eyebrow serif"><span>點 心 紙</span><span class="no">Nº 006</span></div>

  <header class="head">
    <div class="bowl">
      <div class="steam" aria-hidden="true"><span></span><span></span><span></span></div>
